# `rc` points `lefthook install` at `bin/.lefthookrc`, which pins the
# Hermit lefthook and prepends the repo's Hermit `bin/` to PATH so every lane
# resolves the pinned Flutter toolchain regardless of the invoking shell.
rc: bin/.lefthookrc

pre-commit:
  commands:
    mobile-fmt:
      glob: ["*.dart"]
      run: just mobile-fmt
      stage_fixed: true

# Appends the DCO Signed-off-by trailer. `--if-exists doNothing` makes it
# idempotent and preserves an existing sign-off.
commit-msg:
  commands:
    signoff:
      run: 'git interpret-trailers --if-exists doNothing --trailer "Signed-off-by: $(git var GIT_COMMITTER_IDENT | sed ''s/ [0-9]* [+-][0-9]*$//'')" --in-place {1}'

# scripts/without-git-env.sh strips git's repository-local variables so test
# fixtures that run git see their own repositories.
pre-push:
  commands:
    mobile-checks:
      # Analysis and tests run serially so they don't contend for shared
      # Flutter state (.dart_tool, shader bundle).
      run: ./scripts/without-git-env.sh sh -c 'just mobile-check && just mobile-test'
