name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Checks
            lane: checks
          - name: Tests 1/3
            lane: test
            shard: 0
          - name: Tests 2/3
            lane: test
            shard: 1
          - name: Tests 3/3
            lane: test
            shard: 2
          - name: Android
            lane: android
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Compute Hermit cache key
        id: hermit-bin-hash
        run: |
          hash="$(find ./bin ! -type d | sort | xargs openssl sha256 | openssl sha256 -r | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Restore Hermit package cache
        id: hermit-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/hermit/pkg
          key: ${{ runner.os }}-hermit-cache-${{ steps.hermit-bin-hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-hermit-cache-
      - name: Prime Flutter SDK
        run: flutter --version
      - name: Save Hermit package cache
        if: always() && steps.hermit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: ~/.cache/hermit/pkg
          key: ${{ runner.os }}-hermit-cache-${{ steps.hermit-bin-hash.outputs.hash }}
      - name: Restore pub cache
        id: pub-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Install dependencies
        run: flutter pub get
      - name: Save pub cache
        if: always() && steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Format check
        if: matrix.lane == 'checks'
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        if: matrix.lane == 'checks'
        run: flutter analyze
      - name: Test
        if: matrix.lane == 'test'
        run: /bin/bash scripts/mobile-test-shard.sh ${{ matrix.shard }} 3
      - name: Test native secp256k1 package
        if: matrix.lane == 'checks'
        run: cd packages/buzz_secp256k1 && dart pub get && dart test
      - name: Test internal build
        if: matrix.lane == 'checks'
        run: >-
          flutter test
          --dart-define=BUZZ_DISTRIBUTION=internal
          --dart-define=BUZZ_BUILDERLAB_URL=https://id.example.org
          --dart-define=BUZZ_BUILDERLAB_RELAYS=buzz.example.org
          test/features/onboarding/internal_build_entry_test.dart
      - name: Test public build
        if: matrix.lane == 'checks'
        run: >-
          flutter test
          --dart-define=BUZZ_DISTRIBUTION=public
          --dart-define=BUZZ_BUILDERLAB_URL=https://app.builderlab.xyz
          --dart-define=BUZZ_BUILDERLAB_RELAYS=communities.buzz.xyz
          test/shared/auth/community_entry_requirements_test.dart
          test/features/agents/agent_creation_link_journey_test.dart
          test/features/invites/invite_join_provider_test.dart
          test/features/onboarding/onboarding_entry_routes_test.dart
          test/shared/hosted/self_hosted_entry_test.dart
          test/features/agents/agents_signed_out_prompt_test.dart
          test/features/agents/agents_restore_prompt_test.dart
          test/shared/hosted/relay_auth_isolation_test.dart
          test/features/onboarding/hosted_app_gate_environment_test.dart
          test/features/settings/builderlab_account_row_test.dart
          test/features/settings/settings_sign_out_test.dart
          test/features/onboarding/hosted_journeys_test.dart
          test/features/onboarding/hosted_backup_consent_test.dart
          test/features/onboarding/onboarding_sign_out_test.dart
          test/features/onboarding/hosted_communities_test.dart
          test/features/onboarding/account_community_entry_test.dart
          test/features/onboarding/account_sync_recovery_test.dart
          test/features/onboarding/known_communities_provider_test.dart
          test/features/onboarding/known_community_sync_integration_test.dart
          test/features/onboarding/known_community_sync_test.dart
          test/shared/hosted/builderlab_account_test.dart
          test/features/pairing/pairing_hosted_handoff_test.dart
          test/shared/agents/remote_agents_test.dart
          test/features/agents
      - name: Test mobile recipe argument forwarding
        if: matrix.lane == 'checks'
        run: /bin/bash scripts/test-mobile-gateway-recipes.sh
      # ubuntu-26.04 defaults to JDK 25, which Gradle 8.14 does not
      # support. Pin the JDK 17 the 24.04 image used.
      - name: Set up JDK 17
        if: matrix.lane == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore Gradle cache
        if: matrix.lane == 'android'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      # The Hermit package cache above holds only Flutter, so the build's first
      # just and cmake calls download them.
      - name: Fetch Hermit tools
        if: matrix.lane == 'android'
        run: |
          scripts/ci-hermit-retry.sh ./bin/just --version
          scripts/ci-hermit-retry.sh ./bin/cmake --version
      # SDK component and plugin downloads intermittently fail on hosted
      # runners; retry once only for those, so real build failures still fail.
      - name: Build Android debug APK
        if: matrix.lane == 'android'
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/android-build.log"
          if ! just mobile-build-android 2>&1 | tee "$log"; then
            grep -qE 'InstallFailedException|Could not (resolve|GET|download)' "$log"
            just mobile-build-android
          fi
      - name: Test Android JVM units
        if: matrix.lane == 'android'
        run: cd android && ./gradlew :app:testDebugUnitTest --console=plain
      - name: Save Gradle cache
        if: matrix.lane == 'android' && github.event_name == 'push'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}

  # The unsigned release build needs nothing from the native lane, so it runs
  # beside it instead of after the simulator tests.
  mobile-swift:
    name: Mobile Swift (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native
            lane: native
          - name: Release
            lane: release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install Flutter dependencies
        run: flutter pub get
      # `swift test` builds BuzzPushKit; the Release lane covers its release build.
      - name: Test
        if: matrix.lane == 'native'
        run: swift test --package-path ios/BuzzPushKit
      - name: Test native pagination geometry
        if: matrix.lane == 'native'
        run: /bin/bash scripts/test-mobile-pagination.sh
      - name: Generate iOS build configuration
        if: matrix.lane == 'native'
        run: flutter build ios --simulator --debug --no-pub --config-only
      # Build the complete simulator app and RunnerTests once, in the
      # background, while the simulator boots and runs the native-control
      # scripts. The build also guards Apple Silicon simulator linking (block/buzz#7646).
      - name: Test native controls and Runner unit tests
        if: matrix.lane == 'native'
        run: |
          device=$(xcrun simctl create "Native tests" "iPhone 16")
          trap 'xcrun simctl shutdown "$device"; xcrun simctl delete "$device"' EXIT
          xcode=(xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner
            -configuration Debug -destination "platform=iOS Simulator,id=$device"
            CODE_SIGNING_ALLOWED=NO)
          build_log="$RUNNER_TEMP/runner-build.log"
          "${xcode[@]}" build-for-testing > "$build_log" 2>&1 &
          build=$!
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          /bin/bash scripts/test-mobile-pagination-accessibility.sh "$device"
          /bin/bash scripts/test-mobile-carousel.sh "$device"
          /bin/bash scripts/test-mobile-member-picker.sh "$device"
          if ! wait "$build"; then
            cat "$build_log"
            exit 1
          fi
          tail -n 5 "$build_log"
          "${xcode[@]}" -parallel-testing-enabled NO -only-testing:RunnerTests \
            test-without-building
      - name: Build complete unsigned iOS release
        if: matrix.lane == 'release'
        run: |
          /bin/bash scripts/test-mobile-gateway-recipes.sh
          flutter build ios --release --no-codesign --no-pub


  # Required alongside Mobile. It replaces the DCO app's check of the same name,
  # which only reports on pull requests and so never passes in the merge queue.
  dco:
    name: DCO Check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "Commits were checked on their pull request."
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit is signed off by its author
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            email=$(git log -1 --format=%ae "$sha")
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
              | grep -qiF -- "<$email>"; then
              echo "::error::Commit $(git log -1 --format=%h "$sha") has no Signed-off-by for its author, $email."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Sign off each commit: git rebase --signoff $BASE_SHA && git push --force-with-lease"
            exit 1
          fi

  # The single required check for main and the stable branches.
  mobile-result:
    name: Mobile
    if: always()
    needs: [mobile, mobile-swift]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check Mobile result
        env:
          MOBILE_RESULT: ${{ needs.mobile.result }}
          SWIFT_RESULT: ${{ needs.mobile-swift.result }}
        run: test "$MOBILE_RESULT" = success && test "$SWIFT_RESULT" = success
